<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WhaPay – WhatsApp Payments Dashboard for M-Pesa & Cards</title>
<meta name="description" content="WhaPay lets Kenyan merchants accept payments via WhatsApp, M-Pesa, and credit cards. Real-time dashboard, QR/Barcode scanning, and weekly/monthly reports.">
<meta name="keywords" content="WhatsApp payments, M-Pesa payments, Kenya, merchant dashboard, QR payments, card payments, mobile payment solutions">
<meta name="robots" content="index, follow">

<!-- Open Graph -->
<meta property="og:title" content="WhaPay – WhatsApp Payments Dashboard">
<meta property="og:description" content="Accept M-Pesa and card payments via WhatsApp with WhaPay. Live dashboard, QR scanning, weekly/monthly reports.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yourdomain.com/dashboard">
<meta property="og:image" content="https://yourdomain.com/whapay-preview.png">

<!-- Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "WhaPay",
  "url": "https://yourdomain.com/dashboard",
  "description": "WhatsApp payment dashboard for M-Pesa and credit cards in Kenya.",
  "applicationCategory": "FinanceApplication",
  "operatingSystem": "Web",
  "creator": {
    "@type": "Organization",
    "name": "WhaPay Solutions"
  }
}
</script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "whapay.firebaseapp.com",
  projectId: "whapay",
  storageBucket: "whapay.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db = db;
window.serverTimestamp = serverTimestamp;
window.updateDoc = updateDoc;
window.doc = doc;
</script>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>

</head>
<body class="bg-gray-100 font-sans">

<header class="bg-green-600 text-white p-6 rounded-b-lg shadow-md mb-6 text-center">
  <h1 class="text-3xl font-bold mb-2">WhaPay – WhatsApp Payments Dashboard</h1>
  <p class="text-lg">Accept M-Pesa & Card payments instantly, track transactions live, and optionally scan QR codes. Trusted by Kenyan merchants for safe, easy payments.</p>
</header>

<main class="container mx-auto px-4">
  <div id="root"></div>
</main>

<script type="text/babel">
const { useState, useEffect } = React;

// ------------------ Summary Cards ------------------
function SummaryCards() {
  const [transactions, setTransactions] = useState([]);

  useEffect(() => {
    const unsub = onSnapshot(collection(window.db, "whapay_transactions"), snapshot => {
      setTransactions(snapshot.docs.map(doc => doc.data()));
    });
    return () => unsub();
  }, []);

  const totalPaid = transactions.filter(t => t.status === "paid").reduce((acc, t) => acc + t.amount, 0);
  const pending = transactions.filter(t => t.status === "pending").length;
  const now = new Date();

  const weekPaid = transactions.filter(t => {
    const ts = t.timestamp?.toDate ? t.timestamp.toDate() : new Date();
    return (now - ts)/(1000*60*60*24) <= 7 && t.status === "paid";
  }).reduce((acc, t) => acc + t.amount, 0);

  const monthPaid = transactions.filter(t => {
    const ts = t.timestamp?.toDate ? t.timestamp.toDate() : new Date();
    return ts.getMonth() === now.getMonth() && t.status === "paid";
  }).reduce((acc, t) => acc + t.amount, 0);

  return (
    <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      {[
        { label: "Total Paid", value: `KES ${totalPaid}` },
        { label: "Pending", value: pending },
        { label: "Paid This Week", value: `KES ${weekPaid}` },
        { label: "Paid This Month", value: `KES ${monthPaid}` }
      ].map(card => (
        <div key={card.label} className="bg-white shadow rounded p-4 text-center">
          <p className="text-gray-500">{card.label}</p>
          <h2 className="text-2xl font-bold">{card.value}</h2>
        </div>
      ))}
    </section>
  );
}

// ------------------ Transactions Table ------------------
function TransactionsTable() {
  const [transactions, setTransactions] = useState([]);

  useEffect(() => {
    const unsub = onSnapshot(collection(window.db, "whapay_transactions"), snapshot => {
      setTransactions(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
    });
    return () => unsub();
  }, []);

  const markAsPaid = async (id) => {
    await window.updateDoc(window.doc(window.db, "whapay_transactions", id), { status: "paid" });
  };

  return (
    <section className="bg-white shadow rounded p-4 overflow-x-auto mb-6">
      <h2 className="text-xl font-bold mb-4">Transactions</h2>
      <table className="min-w-full border-collapse">
        <thead>
          <tr className="bg-gray-200 text-left">
            <th className="px-4 py-2 border">Txn ID</th>
            <th className="px-4 py-2 border">User</th>
            <th className="px-4 py-2 border">Amount</th>
            <th className="px-4 py-2 border">Method</th>
            <th className="px-4 py-2 border">Status</th>
            <th className="px-4 py-2 border">Action</th>
          </tr>
        </thead>
        <tbody>
          {transactions.length === 0 && (
            <tr>
              <td colSpan={6} className="text-center py-4 text-gray-500">No transactions yet</td>
            </tr>
          )}
          {transactions.map(txn => (
            <tr key={txn.id} className="hover:bg-gray-50">
              <td className="px-4 py-2 border">{txn.id.slice(0,6)}</td>
              <td className="px-4 py-2 border">{txn.userNumber}</td>
              <td className="px-4 py-2 border">KES {txn.amount}</td>
              <td className="px-4 py-2 border">{txn.paymentMethod}</td>
              <td className="px-4 py-2 border">
                {txn.status === "paid" 
                  ? <span className="text-green-600 font-semibold">Paid</span>
                  : <span className="text-yellow-600 font-semibold">Pending</span>}
              </td>
              <td className="px-4 py-2 border">
                {txn.status !== "paid" && (
                  <button className="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm"
                    onClick={() => markAsPaid(txn.id)}>
                    Mark as Paid
                  </button>
                )}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </section>
  );
}

// ------------------ Payment Generator ------------------
function PaymentGenerator() {
  const [userNumber, setUserNumber] = useState("");
  const [amount, setAmount] = useState("");
  const [method, setMethod] = useState("mpesa");
  const [message, setMessage] = useState("");
  const [scanning, setScanning] = useState(false);

  const generatePayment = async () => {
    if (!userNumber || !amount) return setMessage("Enter user number and amount!");

    let phone = userNumber.replace(/\D/g, "");
    if (phone.startsWith("0")) phone = "254" + phone.substring(1);
    if (!phone.startsWith("254")) return setMessage("Invalid phone number!");

    const paymentLink = method === "card"
      ? `https://buy.stripe.com/test_xyz?amount=${amount}&customer=${phone}`
      : `https://sandbox.safaricom.co.ke/mpesa/stkpush?amount=${amount}&phone=${phone}`;

    await addDoc(collection(window.db, "whapay_transactions"), {
      userNumber: phone,
      amount: parseFloat(amount),
      paymentMethod: method,
      paymentLink,
      status: "pending",
      timestamp: window.serverTimestamp()
    });

    const whatsappURL = `https://wa.me/${phone}?text=${encodeURIComponent(
      `Hello 👋\n\nYou have a payment request of KES ${amount}.\nClick to pay:\n${paymentLink}\n\nPowered by WhaPay`
    )}`;

    window.open(whatsappURL, "_blank");
    setMessage("Payment sent to WhatsApp ✔");
    setUserNumber(""); setAmount(""); setScanning(false);
  };

  const startScan = () => {
    setScanning(true);
    const html5QrCode = new Html5Qrcode("qr-reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      qrCodeMessage => {
        const parts = qrCodeMessage.split(":");
        if (parts.length === 2) setAmount(parts[1]);
        html5QrCode.stop(); setScanning(false);
      },
      err => console.log("QR scan error:", err)
    );
  };

  return (
    <section className="bg-white shadow rounded p-4 mb-6">
      <h2 className="text-xl font-bold mb-4">Generate Payment Link</h2>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <input type="text" placeholder="User Phone (+2547...)" className="border px-3 py-2 rounded w-full"
          value={userNumber} onChange={e => setUserNumber(e.target.value)} />
        <input type="number" placeholder="Amount (KES)" className="border px-3 py-2 rounded w-full"
          value={amount} onChange={e => setAmount(e.target.value)} />
        <select className="border px-3 py-2 rounded w-full" value={method} onChange={e => setMethod(e.target.value)}>
          <option value="mpesa">M-Pesa</option>
          <option value="card">Credit/Debit Card</option>
        </select>
      </div>
      <div className="flex gap-4">
        <button className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded" onClick={generatePayment}>
          Generate Link
        </button>
        <button className="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded" onClick={startScan}>
          Scan QR / Barcode (Optional)
        </button>
      </div>
      {scanning && <div id="qr-reader" className="mt-4 w-full h-64 bg-gray-200 rounded"></div>}
      {message && <p className="mt-3 text-blue-600 break-all">{message}</p>}
    </section>
  );
}

// ------------------ App ------------------
function App() {
  return (
    <>
      <SummaryCards />
      <PaymentGenerator />
      <TransactionsTable />
      <section className="p-6 bg-white rounded shadow mb-6 text-center">
        <h2 className="text-xl font-bold mb-2">Trusted by Kenyan Merchants</h2>
        <p className="text-gray-600">Used by over 100+ small businesses across Nairobi and Mombasa for safe and fast WhatsApp payments.</p>
      </section>
    </>
  );
}

// ------------------ Render ------------------
const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>

</body>
</html>
