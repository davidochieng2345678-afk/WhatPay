<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pay via WhaPay – Secure WhatsApp Payments</title>
<meta name="description" content="Pay instantly with M-Pesa or credit/debit card. Scan QR to auto-fill amount. Secure and fast.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16a34a">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}</script>
</head>
<body class="bg-gray-100">

<header class="bg-green-600 text-white p-4 shadow-md">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
    <h1 class="text-2xl font-bold"><a href="index.html">WhaPay</a></h1>
    <nav class="flex flex-wrap gap-2 text-sm">
      <a href="index.html" class="hover:underline">Home</a>
      <a href="merchant.html" class="hover:underline">Merchant</a>
      <a href="payment.html" class="hover:underline font-bold text-green-200">Payment</a>
      <a href="contact.html" class="hover:underline">Contact</a>
    </nav>
  </div>
</header>

<section class="bg-gradient-to-r from-green-700 to-green-500 text-white py-12 px-4 text-center">
  <h1 class="text-3xl md:text-4xl font-bold mb-2">Complete Your Payment</h1>
  <p class="text-lg">Pay with M-Pesa or credit/debit card. Scan QR to auto‑fill amount.</p>
</section>

<main class="max-w-xl mx-auto px-4 py-8">
  <div class="bg-white rounded-2xl shadow-xl p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Payment Details</h2>
    <div class="space-y-4">
      <!-- Phone Number -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Your Phone Number (M-Pesa)</label>
        <input type="tel" id="userNumber" placeholder="+254712345678" class="w-full border rounded-lg px-4 py-2">
        <p class="text-xs text-gray-500 mt-1">We'll send payment confirmation via WhatsApp.</p>
      </div>

      <!-- Amount -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Amount (KES)</label>
        <input type="number" id="amount" placeholder="e.g., 500" class="w-full border rounded-lg px-4 py-2">
      </div>

      <!-- Payment Method -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Payment Method</label>
        <select id="method" class="w-full border rounded-lg px-4 py-2">
          <option value="mpesa">M-Pesa (STK Push)</option>
          <option value="card">Credit / Debit Card (Stripe)</option>
        </select>
      </div>

      <!-- QR Scanner (your feature) -->
      <button id="scanBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg flex items-center justify-center gap-2">
        <i class="fas fa-qrcode"></i> Scan QR to Auto‑fill Amount
      </button>
      <div id="qr-reader" class="hidden w-full h-64 bg-gray-100 rounded-lg overflow-hidden"></div>

      <!-- Pay Button -->
      <button id="payBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg text-lg shadow">Pay Now</button>
      <div id="message" class="text-center text-sm mt-3"></div>
    </div>
  </div>
  <div class="text-center text-gray-500 text-sm mt-6"><i class="fas fa-lock mr-1"></i> Secure – PCI compliant via Stripe</div>
</main>

<footer class="bg-gray-900 text-gray-300 text-center p-4 text-sm mt-8">
  <p>© 2026 WhaPay – Need help? <a href="https://wa.me/254710346425" class="text-green-400">Chat on WhatsApp</a></p>
</footer>
<a href="https://wa.me/254710346425" target="_blank" class="fixed bottom-5 right-5 bg-green-500 text-white p-3 rounded-full shadow-lg z-50"><i class="fab fa-whatsapp text-xl"></i></a>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPAvq6BgpdfZAkfoEwdwmHrWedHgzjRSk",
    authDomain: "whapay-c93ab.firebaseapp.com",
    projectId: "whapay-c93ab",
    storageBucket: "whapay-c93ab.firebasestorage.app",
    messagingSenderId: "205456952458",
    appId: "1:205456952458:web:6533921ca10a2988417173"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Helper functions (from your page)
  function validatePhone(phone) {
    const cleaned = phone.replace(/\D/g, '');
    if (cleaned.startsWith('0') && cleaned.length === 10) return true;
    if (cleaned.startsWith('254') && cleaned.length === 12) return true;
    if (cleaned.length === 9 && cleaned.startsWith('7')) return true;
    return false;
  }
  function normalizePhone(phone) {
    let cleaned = phone.replace(/\D/g, '');
    if (cleaned.startsWith('0')) cleaned = '254' + cleaned.substring(1);
    if (!cleaned.startsWith('254')) cleaned = '254' + cleaned;
    return cleaned;
  }
  function sendWhatsApp(phone, message) {
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
  }
  async function saveTransaction(customerPhone, amount, method, merchantCode = null) {
    try {
      return await addDoc(collection(db, "transactions"), {
        customerPhone, amount, method, merchantCode,
        status: "pending", createdAt: serverTimestamp()
      });
    } catch (e) { console.error(e); return null; }
  }
  function showToast(msg, isErr = false) {
    let toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-sm z-50 hidden';
      document.body.appendChild(toast);
    }
    toast.innerText = msg;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 4000);
  }

  // QR Scanner (from your page)
  let html5QrCode = null;
  const scanBtn = document.getElementById('scanBtn');
  const qrReaderDiv = document.getElementById('qr-reader');
  const amountInput = document.getElementById('amount');
  scanBtn.addEventListener('click', async () => {
    if (qrReaderDiv.classList.contains('hidden')) {
      qrReaderDiv.classList.remove('hidden');
      try {
        html5QrCode = new Html5Qrcode("qr-reader");
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          (decodedText) => {
            const match = decodedText.match(/\d+(?:\.\d+)?/);
            if (match) amountInput.value = match[0];
            showToast(`Amount auto‑filled from QR`);
            html5QrCode.stop();
            qrReaderDiv.classList.add('hidden');
          },
          (err) => console.log(err)
        );
      } catch (err) {
        showToast("Camera error. Check permissions.", true);
        qrReaderDiv.classList.add('hidden');
      }
    } else {
      if (html5QrCode) html5QrCode.stop();
      qrReaderDiv.classList.add('hidden');
    }
  });

  // Payment processing
  const payBtn = document.getElementById('payBtn');
  const userNumberInput = document.getElementById('userNumber');
  const methodSelect = document.getElementById('method');
  const messageDiv = document.getElementById('message');

  payBtn.addEventListener('click', async () => {
    const rawPhone = userNumberInput.value.trim();
    const amount = parseFloat(amountInput.value);
    const method = methodSelect.value;

    if (!rawPhone || !validatePhone(rawPhone)) {
      showToast("Enter a valid Kenyan phone number (e.g., 0712345678)", true);
      return;
    }
    if (!amount || amount <= 0) {
      showToast("Enter a valid amount", true);
      return;
    }

    const phone = normalizePhone(rawPhone);
    payBtn.disabled = true;
    payBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Processing...';
    messageDiv.innerHTML = '';

    try {
      if (method === 'mpesa') {
        // Real M‑Pesa STK Push – call Firebase Function
        const response = await fetch('https://your-region-whapay.cloudfunctions.net/stkPush', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount, accountReference: 'WhaPay' })
        });
        const data = await response.json();
        if (data.ResponseCode === '0') {
          await saveTransaction(phone, amount, 'mpesa');
          messageDiv.innerHTML = `<div class="bg-green-50 p-3 rounded text-green-800">✅ Check your phone for M-Pesa prompt. Complete payment within 60 seconds.</div>`;
        } else {
          throw new Error(data.ResponseDescription || 'M-Pesa request failed');
        }
      } else if (method === 'card') {
        // Stripe card – redirect to Stripe Checkout (live)
        const stripe = Stripe('pk_live_YOUR_STRIPE_PUBLISHABLE_KEY'); // replace with your live key
        const response = await fetch('https://your-region-whapay.cloudfunctions.net/createCheckoutSession', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount, customerPhone: phone })
        });
        const { sessionId } = await response.json();
        await stripe.redirectToCheckout({ sessionId });
      }
    } catch (err) {
      showToast(err.message, true);
      // Fallback: notify admin via WhatsApp (your feature)
      const adminPhone = '254710346425';
      const adminMsg = `⚠️ Payment failed for ${phone}\nAmount: KES ${amount}\nMethod: ${method}\nError: ${err.message}`;
      sendWhatsApp(adminPhone, adminMsg);
      messageDiv.innerHTML = `<div class="bg-red-50 p-3 rounded text-red-800">❌ Payment failed. Admin notified. Please try again later.</div>`;
    } finally {
      payBtn.disabled = false;
      payBtn.innerHTML = 'Pay Now';
    }
  });
</script>
</body>
</html>
