<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaPay Directory – Find Merchants Accepting M-Pesa & Cards</title>
    <meta name="description" content="Find local merchants in Kenya that accept M-Pesa, Visa, Mastercard, Airtel, MTN, Tigo, and Orange payments. Search by category or location.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
<div class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900">🔍 WhaPay <span class="text-green-600">Merchant Directory</span></h1>
        <p class="text-gray-500 mt-2">Find businesses that accept M-Pesa, Cards, and Mobile Money</p>
    </div>

    <!-- Search & Filters -->
    <div class="bg-white rounded-2xl shadow-sm p-4 mb-6">
        <div class="flex flex-wrap gap-3 items-center justify-between">
            <input type="text" id="searchInput" placeholder="Search by business name, category, or location..." class="flex-1 border rounded-xl px-4 py-2 min-w-[200px]">
            <select id="categoryFilter" class="border rounded-xl px-4 py-2">
                <option value="">All Categories</option>
                <option value="grocery">🛒 Grocery</option>
                <option value="salon">💇 Salon/Beauty</option>
                <option value="hardware">🔧 Hardware</option>
                <option value="restaurant">🍽️ Restaurant</option>
                <option value="electronics">📱 Electronics</option>
                <option value="fashion">👗 Fashion</option>
                <option value="pharmacy">💊 Pharmacy</option>
            </select>
            <select id="locationFilter" class="border rounded-xl px-4 py-2">
                <option value="">All Locations</option>
                <option value="nairobi">Nairobi</option>
                <option value="kisumu">Kisumu</option>
                <option value="mombasa">Mombasa</option>
                <option value="nakuru">Nakuru</option>
                <option value="eldoret">Eldoret</option>
            </select>
        </div>
    </div>

    <!-- Merchants Grid -->
    <div id="merchantsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="col-span-full text-center py-10">Loading merchants...</div>
    </div>
</div>

<script>
    let allMerchants = [];

    async function loadMerchants() {
        try {
            const res = await fetch('https://whapay-backend.onrender.com/api/directory/merchants');
            const data = await res.json();
            if (data.success) {
                allMerchants = data.merchants;
                filterAndRender();
            } else {
                document.getElementById('merchantsGrid').innerHTML = '<div class="col-span-full text-center text-red-500">Failed to load merchants. Please try again later.</div>';
            }
        } catch (err) {
            document.getElementById('merchantsGrid').innerHTML = '<div class="col-span-full text-center text-red-500">Network error. Please refresh.</div>';
        }
    }

    function filterAndRender() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const category = document.getElementById('categoryFilter').value;
        const location = document.getElementById('locationFilter').value;

        let filtered = allMerchants.filter(m => {
            const matchesSearch = !searchTerm || m.businessName.toLowerCase().includes(searchTerm) || (m.categoryName && m.categoryName.toLowerCase().includes(searchTerm));
            const matchesCategory = !category || m.category === category;
            const matchesLocation = !location || m.location === location;
            return matchesSearch && matchesCategory && matchesLocation;
        });

        if (filtered.length === 0) {
            document.getElementById('merchantsGrid').innerHTML = '<div class="col-span-full text-center py-10">No merchants found. Be the first to <a href="/claim-directory.html" class="text-green-600 underline">claim your listing</a>.</div>';
            return;
        }

        document.getElementById('merchantsGrid').innerHTML = filtered.map(m => `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition">
                <div class="flex items-start justify-between">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800"><a href="/directory/merchant/${m.merchantCode}" class="hover:text-green-600">${m.businessName}</a></h3>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-sm text-gray-500"><i class="fas fa-map-marker-alt"></i> ${m.locationName} ${m.area ? `- ${m.area}` : ''}</span>
                            <span class="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full">${m.categoryName || m.category}</span>
                            ${m.premium ? '<span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full">⭐ Featured</span>' : ''}
                        </div>
                    </div>
                </div>
                <p class="text-gray-600 text-sm mt-2 line-clamp-2">${m.description || 'No description provided.'}</p>
                <div class="mt-3 flex items-center justify-between">
                    <div class="text-xs font-mono bg-gray-100 px-2 py-1 rounded">Code: ${m.merchantCode}</div>
                    <a href="/payment.html?merchant=${m.merchantCode}" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-sm hover:bg-green-700 transition">💳 Pay Now</a>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', filterAndRender);
    document.getElementById('categoryFilter').addEventListener('change', filterAndRender);
    document.getElementById('locationFilter').addEventListener('change', filterAndRender);

    loadMerchants();
</script>
</body>
</html>
