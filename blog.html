<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhaPay Blog Post</title>
<meta name="description" content="Read this detailed guide about WhatsApp payments with WhaPay. M-Pesa, card payments, and tips for Kenyan businesses.">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<header class="bg-green-600 text-white p-6 text-center shadow-md">
  <h1 class="text-3xl font-bold">WhaPay Blog</h1>
  <p>Tips, guides, and tutorials for WhatsApp payments in Kenya</p>
</header>

<main class="max-w-4xl mx-auto p-6 bg-white mt-6 rounded shadow-md">

  <article id="blogPost">
    <p class="text-gray-500 text-center">Loading post...</p>
  </article>

</main>

<footer class="bg-gray-900 text-gray-300 text-center p-6 mt-6 rounded-t-lg">
  &copy; 2026 WhaPay Solutions. All rights reserved.
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

// --- Firebase config ---
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "whapay.firebaseapp.com",
  projectId: "whapay",
  storageBucket: "whapay.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// --- Ensure same collection name as admin ---
const blogCol = collection(db, "blogs");

// --- Get slug from URL ---
const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");

const postContainer = document.getElementById("blogPost");

// --- Load post ---
async function loadPost() {
  if(!slug) {
    postContainer.innerHTML = "<p class='text-red-500 text-center'>No post specified.</p>";
    return;
  }

  const q = query(blogCol, where("slug", "==", slug));
  const snapshot = await getDocs(q);

  if(!snapshot.empty){
    const post = snapshot.docs[0].data();
    const date = post.createdAt?.toDate?.() || new Date();
    postContainer.innerHTML = `
      <h1 class="text-3xl font-bold mb-2">${post.title}</h1>
      <p class="text-gray-500 mb-4">
        ${post.author || "Admin"} | ${date.toLocaleDateString("en-KE")} | ${post.category || "General"}
      </p>
      ${post.image ? `<img src="${post.image}" alt="${post.title}" class="rounded mb-4 w-full object-cover">` : ""}
      <div class="text-gray-700 mb-4">${post.content}</div>
      ${post.tags ? `<p class="text-sm text-gray-500">Tags: ${post.tags.join(", ")}</p>` : ""}
    `;
  } else {
    postContainer.innerHTML = "<p class='text-red-500 text-center'>Post not found.</p>";
  }
}

loadPost();
</script>

</body>
</html>
