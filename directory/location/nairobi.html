<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nairobi Merchants Accepting M-Pesa & Cards | WhaPay Directory</title>
<meta name="description" content="Find businesses in Nairobi that accept M-Pesa, Visa, and Mastercard payments. Grocery stores, salons, electronics, restaurants, and more.">
<link rel="canonical" href="https://whapay.space/directory/location/nairobi.html">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f5f5f5}.header{background:linear-gradient(135deg,#0a0f1e,#0f1629);color:white;padding:40px 20px;text-align:center}.header h1{font-size:2rem;margin-bottom:10px}.header h1 span{color:#22c55e}.header p{color:rgba(255,255,255,0.6);margin-top:10px}.container{max-width:1200px;margin:0 auto;padding:30px 20px}.back-link{display:inline-block;margin-bottom:20px;color:#16a34a;text-decoration:none;font-weight:500}.back-link:hover{text-decoration:underline}.search-box{width:100%;padding:14px 20px;font-size:16px;border:1px solid #e5e7eb;border-radius:50px;margin-bottom:25px;outline:none;transition:border 0.2s}.search-box:focus{border-color:#16a34a}.merchant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}.merchant-card{background:white;border-radius:16px;padding:20px;border:1px solid #e5e7eb;transition:transform 0.2s,box-shadow 0.2s}.merchant-card:hover{transform:translateY(-3px);box-shadow:0 5px 20px rgba(0,0,0,0.08)}.merchant-card h3{color:#1f2937;margin-bottom:5px;font-size:1.1rem}.merchant-card .area{color:#6b7280;font-size:0.8rem;margin-bottom:8px}.merchant-card .category{display:inline-block;background:#dcfce7;color:#166534;padding:3px 10px;border-radius:20px;font-size:0.7rem;margin-bottom:10px}.merchant-card .rating{color:#fbbf24;margin:10px 0;font-size:0.85rem}.merchant-card .code{background:#f3f4f6;padding:10px;border-radius:8px;font-family:monospace;font-size:0.8rem;margin:10px 0;text-align:center}.btn-pay{background:#16a34a;color:white;border:none;padding:10px 15px;border-radius:10px;width:100%;cursor:pointer;font-weight:600;margin-top:10px;transition:background 0.2s}.btn-pay:hover{background:#15803d}.btn-copy{background:#e5e7eb;color:#374151;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:0.75rem;width:100%;margin-top:8px}.bank-request{background:#f0fdf4;padding:20px;border-radius:12px;margin:30px 0;text-align:center;border:1px solid #bbf7d0}.bank-btn{background:#16a34a;color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:600;margin-top:10px}.footer{background:#1f2937;color:#9ca3af;text-align:center;padding:40px 20px;margin-top:50px}.footer a{color:#22c55e;text-decoration:none}.footer a:hover{text-decoration:underline}.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.clear-search{background:#6b7280;color:white;border:none;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:0.8rem}
</style>
</head>
<body>

<div class="header">
    <h1>📍 <span>Nairobi Merchants</span></h1>
    <p>Find businesses in Nairobi that accept M-Pesa, Visa, and Mastercard</p>
</div>

<div class="container">
    <a href="/directory/" class="back-link">← Back to Directory</a>
    
    <input type="text" id="searchInput" class="search-box" placeholder="Search by merchant name, area (Westlands, CBD, Kilimani...), or category...">

    <div id="resultsContainer">
        <div id="merchantsGrid" class="merchant-grid"></div>
    </div>

    <div class="bank-request">
        <p>🏦 <strong>Your bank not on WhaPay yet?</strong></p>
        <p style="font-size:14px; margin:10px 0;">Click below to request your bank to join WhaPay</p>
        <button class="bank-btn" onclick="requestBank()">📢 Request My Bank</button>
    </div>
</div>

<div class="footer">
    <p>📞 0140933042 | 📧 support@whapay.space</p>
    <p><a href="/directory/">Directory Home</a> | <a href="/privacy.html">Privacy</a> | <a href="https://wa.me/254140933042">WhatsApp Support</a></p>
</div>

<script>
// All Nairobi merchants
const nairobiMerchants = [
    { name: "Mary's Fresh Groceries", area: "CBD", category: "Grocery", code: "DK12345", rating: 4.8, reviews: 124, phone: "0712345678", description: "Fresh fruits, vegetables, and household items." },
    { name: "James Beauty Salon", area: "Westlands", category: "Salon", code: "DK67890", rating: 4.9, reviews: 89, phone: "0723456789", description: "Hair styling, nails, and makeup." },
    { name: "Nairobi Electronics Hub", area: "CBD", category: "Electronics", code: "DK99999", rating: 4.7, reviews: 156, phone: "0798765432", description: "Phones, laptops, and accessories." },
    { name: "Nairobi Bistro", area: "Kilimani", category: "Restaurant", code: "DK77777", rating: 4.7, reviews: 112, phone: "0790123456", description: "Italian & local cuisine. Outdoor seating." },
    { name: "Nairobi Trendz Fashion", area: "CBD", category: "Fashion", code: "DK77788", rating: 4.6, reviews: 98, phone: "0790123457", description: "Designer clothes, shoes, and handbags." },
    { name: "Nairobi Wellness Pharmacy", area: "Kilimani", category: "Pharmacy", code: "DK55555", rating: 4.8, reviews: 156, phone: "0778901234", description: "Chronic disease management, vaccines, and home delivery." },
    { name: "Karen Hardware Store", area: "Karen", category: "Hardware", code: "DK12399", rating: 4.5, reviews: 67, phone: "0712345699", description: "Building materials, paints, and tools." },
    { name: "Ngara Fresh Market", area: "Ngara", category: "Grocery", code: "DK12400", rating: 4.3, reviews: 45, phone: "0712345700", description: "Local produce and affordable groceries." }
];

// Render function
function renderMerchantCard(m) {
    const stars = '⭐'.repeat(Math.floor(m.rating)) + (m.rating % 1 >= 0.5 ? '½' : '');
    return `
        <div class="merchant-card">
            <h3>${m.name}</h3>
            <div class="area">📍 ${m.area}</div>
            <span class="category">${m.category}</span>
            <div class="rating">${stars} ${m.rating} (${m.reviews} reviews)</div>
            <p style="font-size:0.8rem;color:#6b7280;margin:10px 0;">${m.description}</p>
            <div class="code">
                <strong>Member Code:</strong> ${m.code}
                <button class="btn-copy" onclick="copyCode('${m.code}')">📋 Copy Code</button>
            </div>
            <button class="btn-pay" onclick="payMerchant('${m.name}', '${m.code}')">💳 Pay Now via WhaPay</button>
            <a href="https://wa.me/${m.phone}?text=Hello%20${encodeURIComponent(m.name)}%2C%20I%20want%20to%20pay%20via%20WhaPay" target="_blank" style="display:block;text-align:center;margin-top:8px;color:#25D366;text-decoration:none;font-size:0.75rem;">💬 Chat on WhatsApp</a>
        </div>
    `;
}

// Display all merchants (or filtered)
function displayMerchants(merchantsToShow) {
    const grid = document.getElementById('merchantsGrid');
    if (!merchantsToShow.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px;">🔍 No merchants found. Try a different search term.</div>`;
        return;
    }
    grid.innerHTML = merchantsToShow.map(renderMerchantCard).join('');
}

// Search function
function filterMerchants() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    if (query.length < 2) {
        displayMerchants(nairobiMerchants);
        return;
    }
    const filtered = nairobiMerchants.filter(m =>
        m.name.toLowerCase().includes(query) ||
        m.area.toLowerCase().includes(query) ||
        m.category.toLowerCase().includes(query) ||
        m.description.toLowerCase().includes(query)
    );
    displayMerchants(filtered);
}

// Helper functions
function copyCode(code) {
    navigator.clipboard.writeText(code);
    alert(`✅ Member Code ${code} copied!\n\nOpen M-Pesa → Lipa na M-Pesa → Paybill → Account: ${code} → Amount → PIN`);
}

function payMerchant(name, code) {
    window.location.href = `/payment.html?merchant=${encodeURIComponent(name)}&code=${code}`;
}

function requestBank() {
    let bank = prompt("Enter your bank name (e.g., KCB, Equity, Co-op):");
    let phone = prompt("Enter your phone number for updates:");
    if(bank && phone) {
        let message = `Bank Request (Nairobi): ${bank} from ${phone}`;
        window.open(`https://wa.me/254140933042?text=${encodeURIComponent(message)}`);
        alert(`✅ Request sent! We'll notify ${bank} about customer demand.`);
    }
}

// Event listener for search
document.getElementById('searchInput').addEventListener('input', filterMerchants);

// Initial display
displayMerchants(nairobiMerchants);
</script>
</body>
</html>
