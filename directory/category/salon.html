<!DOCTYPE html>

<head>

<link rel="canonical" href="https://whapay.space/directory/category/salon.html">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f5f5f5}.header{background:linear-gradient(135deg,#0a0f1e,#0f1629);color:white;padding:40px 20px;text-align:center}.header h1{font-size:2rem}.header h1 span{color:#22c55e}.header p{color:rgba(255,255,255,0.6);margin-top:10px}.container{max-width:1200px;margin:0 auto;padding:30px 20px}.back-link{display:inline-block;margin-bottom:20px;color:#16a34a;text-decoration:none;font-weight:500}.back-link:hover{text-decoration:underline}.section-title{font-size:1.5rem;color:#1f2937;margin-bottom:20px;padding-bottom:10px;border-bottom:3px solid #22c55e;display:inline-block}.merchant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}.merchant-card{background:white;border-radius:16px;padding:20px;border:1px solid #e5e7eb;transition:transform 0.2s,box-shadow 0.2s}.merchant-card:hover{transform:translateY(-3px);box-shadow:0 5px 20px rgba(0,0,0,0.08)}.merchant-card h3{color:#1f2937;margin-bottom:5px;font-size:1.1rem}.merchant-card .location{color:#6b7280;font-size:0.8rem;margin-bottom:10px}.merchant-card .rating{color:#fbbf24;margin:10px 0;font-size:0.85rem}.merchant-card .services{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.service-tag{background:#f3e8ff;color:#6b21a5;padding:3px 8px;border-radius:20px;font-size:0.7rem}.merchant-card .code{background:#f3f4f6;padding:10px;border-radius:8px;font-family:monospace;font-size:0.8rem;margin:10px 0;text-align:center}.btn-pay{background:#16a34a;color:white;border:none;padding:10px 15px;border-radius:10px;width:100%;cursor:pointer;font-weight:600;margin-top:10px;transition:background 0.2s}.btn-pay:hover{background:#15803d}.btn-copy{background:#e5e7eb;color:#374151;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:0.75rem;width:100%;margin-top:8px}.footer{background:#1f2937;color:#9ca3af;text-align:center;padding:40px 20px;margin-top:50px}.footer a{color:#22c55e;text-decoration:none}.footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="header">
    <h1>💇 <span>Salons & Beauty</span></h1>
    <p>Find salons, barbershops, nail studios, and spas that accept M-Pesa, Visa, and Mastercard</p>
</div>

<div class="container">
    <a href="/directory/" class="back-link">← Back to Directory</a>
    <h2 class="section-title">✨ Top Salons in Kenya</h2>
    <div id="merchantsList" class="merchant-grid"></div>
</div>

<div class="footer">
    <p>📞 0140933042 | 📧 support@whapay.space</p>
    <p><a href="/directory/">Directory Home</a> | <a href="/privacy.html">Privacy</a> | <a href="https://wa.me/254140933042">WhatsApp Support</a></p>
</div>

<script>
const salonMerchants = [
    {
        name: "James Beauty Salon",
        location: "Nairobi - Westlands",
        code: "DK67890",
        rating: 4.9,
        reviews: 89,
        phone: "0723456789",
        description: "Professional hair styling, manicure, pedicure, and makeup services.",
        services: ["Hair Cut", "Nails", "Makeup", "Facial"]
    },
    {
        name: "Amina Naturals Spa",
        location: "Mombasa - Nyali",
        code: "DK78901",
        rating: 4.8,
        reviews: 67,
        phone: "0734567890",
        description: "Organic treatments, massage, and bridal packages. Card payments accepted.",
        services: ["Massage", "Facial", "Bridal", "Organic"]
    },
    {
        name: "Kisumu Beauty Lounge",
        location: "Kisumu - CBD",
        code: "DK89012",
        rating: 4.6,
        reviews: 45,
        phone: "0745678901",
        description: "Full beauty services including threading, waxing, and eyelash extensions.",
        services: ["Threading", "Waxing", "Lashes", "Brows"]
    },
    {
        name: "Eldoret Barbershop & Salon",
        location: "Eldoret - CBD",
        code: "DK90123",
        rating: 4.5,
        reviews: 78,
        phone: "0756789012",
        description: "Men's grooming, haircuts, beard trimming, and women's styling.",
        services: ["Men's Cut", "Beard", "Women's Style", "Color"]
    },
    {
        name: "Nakuru Glam Studio",
        location: "Nakuru - CBD",
        code: "DK01234",
        rating: 4.7,
        reviews: 56,
        phone: "0767890123",
        description: "Event makeup, braiding, and latest hairstyles. M-Pesa and cards welcome.",
        services: ["Braiding", "Makeup", "Event Style", "Extensions"]
    }
];

function renderCard(m) {
    const stars = '⭐'.repeat(Math.floor(m.rating)) + (m.rating % 1 >= 0.5 ? '½' : '');
    const servicesHtml = m.services.map(s => `<span class="service-tag">${s}</span>`).join('');
    return `
        <div class="merchant-card">
            <h3>${m.name}</h3>
            <div class="location">📍 ${m.location}</div>
            <div class="rating">${stars} ${m.rating} (${m.reviews} reviews)</div>
            <div class="services">${servicesHtml}</div>
            <p style="font-size: 0.8rem; color: #6b7280; margin: 10px 0;">${m.description}</p>
            <div class="code">
                <strong>Member Code:</strong> ${m.code}
                <button class="btn-copy" onclick="copyCode('${m.code}')">📋 Copy Code</button>
            </div>
            <button class="btn-pay" onclick="pay('${m.name}', '${m.code}')">💳 Pay Now via WhaPay</button>
            <a href="https://wa.me/${m.phone}?text=Hello%20${encodeURIComponent(m.name)}%2C%20I%20want%20to%20pay%20via%20WhaPay" target="_blank" style="display: block; text-align: center; margin-top: 8px; color: #25D366; text-decoration: none; font-size: 0.75rem;">💬 Chat on WhatsApp</a>
        </div>
    `;
}

function copyCode(code) {
    navigator.clipboard.writeText(code);
    alert(`✅ Member Code ${code} copied!\n\nOpen M-Pesa → Lipa na M-Pesa → Paybill → Account: ${code} → Amount → PIN`);
}

function pay(name, code) {
    window.location.href = `/payment.html?merchant=${encodeURIComponent(name)}&code=${code}`;
}

document.getElementById('merchantsList').innerHTML = salonMerchants.map(renderCard).join('');
</script>
</body>
</html>
