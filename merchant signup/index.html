<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register as Merchant – WhaPay Kenya</title>
<meta name="description" content="Register your business on WhaPay and start receiving payments via WhatsApp instantly in Kenya.">

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 font-sans">

<!-- HEADER -->
<header class="bg-green-600 text-white p-6 text-center shadow">
  <h1 class="text-3xl font-bold">Become a WhaPay Merchant</h1>
  <p class="mt-2">Get your payment code & QR instantly</p>
</header>

<!-- FORM -->
<main class="max-w-xl mx-auto mt-8 bg-white p-6 rounded shadow">

  <h2 class="text-xl font-bold mb-4 text-center">Register Your Business</h2>

  <input id="name" type="text" placeholder="Business Name"
    class="w-full border px-3 py-2 rounded mb-3">

  <input id="phone" type="text" placeholder="Phone Number (+254...)"
    class="w-full border px-3 py-2 rounded mb-4">

  <button id="registerBtn"
    class="w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded font-semibold">
    Generate My Code
  </button>

  <p id="status" class="text-center mt-4"></p>

  <!-- RESULT -->
  <div id="result" class="hidden mt-6 text-center">

    <h3 class="text-lg font-bold mb-2">Your Merchant Code</h3>

    <p id="codeDisplay" class="text-2xl font-bold text-green-600 mb-4"></p>

    <canvas id="qrCanvas" class="mx-auto mb-4"></canvas>

    <button id="copyBtn"
      class="bg-blue-500 text-white px-4 py-2 rounded mr-2">
      Copy Code
    </button>

    <button id="shareBtn"
      class="bg-green-500 text-white px-4 py-2 rounded">
      Share on WhatsApp
    </button>

  </div>

</main>

<!-- QR LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<!-- FIREBASE + LOGIC -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDPAvq6BgpdfZAkfoEwdwmHrWedHgzjRSk",
  authDomain: "whapay-c93ab.firebaseapp.com",
  projectId: "whapay-c93ab",
  storageBucket: "whapay-c93ab.firebasestorage.app",
  messagingSenderId: "205456952458",
  appId: "1:205456952458:web:6533921ca10a2988417173"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Elements
const btn = document.getElementById("registerBtn");
const status = document.getElementById("status");
const result = document.getElementById("result");
const codeDisplay = document.getElementById("codeDisplay");

// 🔢 Generate Code
function generateCode(name) {
  const prefix = name.substring(0, 2).toUpperCase();
  const random = Math.floor(1000 + Math.random() * 9000);
  return prefix + random;
}

// 🔁 Ensure Unique Code
async function getUniqueCode(name) {
  let code;
  let exists = true;

  while (exists) {
    code = generateCode(name);

    const q = query(collection(db, "merchants"), where("code", "==", code));
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      exists = false;
    }
  }

  return code;
}

// 🚀 Register Merchant
btn.addEventListener("click", async () => {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if (!name || !phone) {
    status.textContent = "Fill all fields";
    return;
  }

  status.textContent = "Creating your merchant account...";

  try {

    const code = await getUniqueCode(name);

    await addDoc(collection(db, "merchants"), {
      name,
      phone,
      code,
      createdAt: serverTimestamp()
    });

    // Show result
    codeDisplay.textContent = code;
    result.classList.remove("hidden");

    // Generate QR
    const url = `${window.location.origin}/pay.html?merchant=${code}`;

    QRCode.toCanvas(document.getElementById("qrCanvas"), url);

    status.textContent = "✅ Account created successfully";

    // Copy
    document.getElementById("copyBtn").onclick = () => {
      navigator.clipboard.writeText(code);
      alert("Code copied!");
    };

    // WhatsApp Share
    document.getElementById("shareBtn").onclick = () => {
      const msg = `Pay me via WhaPay:\nCode: ${code}\n${url}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
    };

  } catch (err) {
    status.textContent = "Error creating account";
  }

});

</script>

</body>
</html>
