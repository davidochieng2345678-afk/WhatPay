<style>

isplay:inline-block;background:#dcfce7;color:#166534;padding:3px 10px;border-radius:20px;font-size:0.7rem;margin-right:8px}
</style>
</head>
<body>

<div class="header">

</div>

<div class="footer">

    <p><a href="/directory/">Directory Home</a> | <a href="/privacy.html">Privacy</a> | <a href="https://wa.me/254140933042">WhatsApp Support</a></p>
</div>

<script>
const pharmacyMerchants = [

        hours: "24 hours / 7 days",

    },
    {
        name: "Nairobi Wellness Pharmacy",
        location: "Nairobi - Kilimani",
        code: "DK55555",
        rating: 4.8,
        reviews: 156,
        phone: "0778901234",
        description: "Chronic disease management, vaccines, and home delivery. Accepts all cards.",
        hours: "8am - 10pm daily",
        license: "PPB Licensed"
    },
    {
        name: "Mombasa Coastal Drug Store",
        location: "Mombasa - CBD",
        code: "DK66666",
        rating: 4.7,
        reviews: 98,
        phone: "0789012345",
        description: "Affordable generic medicines and first aid supplies. M-Pesa and cards accepted.",
        hours: "7am - 9pm Mon-Sat",
        license: "PPB Licensed"
    },
    {
        name: "Kisumu Central Pharmacy",
        location: "Kisumu - Milimani",
        code: "DK77777",
        rating: 4.6,
        reviews: 112,
        phone: "0790123456",
        description: "Wide range of prescription drugs, baby care, and medical equipment.",
        hours: "8am - 8pm daily",

    },
    {
        name: "Nakuru Health Hub",
        location: "Nakuru - CBD",
        code: "DK88888",

        reviews: 87,
        phone: "0801234567",
        description: "Pharmacy + lab services. Free blood pressure check. Card payments welcome.",
        hours: "8am - 9pm daily",
        license: "PPB Licensed"
    }
];

function renderCard(m) {
    const stars = '⭐'.repeat(Math.floor(m.rating)) + (m.rating % 1 >= 0.5 ? '½' : '');
    return `
        <div class="merchant-card">
            <div><span class="badge">✅ ${m.license}</span><span class="badge">💳 Cards Accepted</span></div>
            <h3>${m.name}</h3>
            <div class="location">📍 ${m.location}</div>
            <div class="hours">🕐 ${m.hours}</div>
            <div class="rating">${stars} ${m.rating} (${m.reviews} reviews)</div>
            <p style="font-size: 0.8rem; color: #6b7280; margin: 10px 0;">${m.description}</p>
            <div class="code">
                <strong>Member Code:</strong> ${m.code}
                <button class="btn-copy" onclick="copyCode('${m.code}')">📋 Copy Code</button>
            </div>
            <button class="btn-pay" onclick="pay('${m.name}', '${m.code}')">💳 Pay Now via WhaPay</button>
            <a href="https://wa.me/${m.phone}?text=Hello%20${encodeURIComponent(m.name)}%2C%20I%20need%20medicine%20and%20want%20to%20pay%20via%20WhaPay" target="_blank" style="display: block; text-align: center; margin-top: 8px; color: #25D366; text-decoration: none; font-size: 0.75rem;">💬 Order on WhatsApp</a>
        </div>
    `;
}

function copyCode(code) {
    navigator.clipboard.writeText(code);
    alert(`✅ Member Code ${code} copied!\n\nOpen M-Pesa → Lipa na M-Pesa → Paybill → Account: ${code} → Amount → PIN`);
}

function pay(name, code) {
    window.location.href = `/payment.html?merchant=${encodeURIComponent(name)}&code=${code}`;
}

document.getElementById('merchantsList').innerHTML = pharmacyMerchants.map(renderCard).join('');
</script>
</body>
</html>
