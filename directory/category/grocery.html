<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Stores in Kenya Accepting Cards & M-Pesa | WhaPay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f5f5f5}.header{background:linear-gradient(135deg,#0a0f1e,#0f1629);color:white;padding:40px 20px;text-align:center}.header h1 span{color:#22c55e}.container{max-width:1200px;margin:0 auto;padding:30px 20px}.back-link{color:#16a34a;text-decoration:none;display:inline-block;margin-bottom:20px}.merchant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}.merchant-card{background:white;border-radius:16px;padding:20px;border:1px solid #e5e7eb}.merchant-card h3{margin-bottom:5px}.merchant-card .location{color:#6b7280;font-size:0.8rem}.merchant-card .rating{color:#fbbf24;margin:10px 0}.merchant-card .code{background:#f3f4f6;padding:8px;border-radius:8px;text-align:center;margin:10px 0}.btn-pay{background:#16a34a;color:white;border:none;padding:10px;border-radius:10px;width:100%;cursor:pointer;font-weight:600}.btn-copy{background:#e5e7eb;padding:6px 12px;border-radius:8px;cursor:pointer;margin-top:8px;width:100%}.footer{background:#1f2937;color:#9ca3af;text-align:center;padding:40px;margin-top:50px}
</style>
</head>
<body>
<div class="header"><h1>🛒 <span>Grocery Stores</span></h1><p>Grocery stores accepting M-Pesa, Visa, and Mastercard</p></div>
<div class="container"><a href="/directory/" class="back-link">← Back to Directory</a><div id="merchantsList" class="merchant-grid"></div></div>
<div class="footer"><p>📞 0140933042 | 📧 support@whapay.space</p></div>
<script>
const merchants = [
    {name:"Mary's Fresh Groceries",location:"Nairobi CBD",code:"DK12345",rating:4.8,reviews:124,phone:"0712345678",description:"Fresh fruits and vegetables"},
    {name:"Kisumu Fresh Market",location:"Kisumu",code:"DK55555",rating:4.4,reviews:78,phone:"0778901234",description:"Local produce and organic foods"}
];
function renderCard(m){
    const stars='⭐'.repeat(Math.floor(m.rating));
    return `<div class="merchant-card"><h3>${m.name}</h3><div class="location">📍 ${m.location}</div><div class="rating">${stars} ${m.rating} (${m.reviews} reviews)</div><p>${m.description}</p><div class="code"><strong>Code:</strong> ${m.code}<button class="btn-copy" onclick="copyCode('${m.code}')">📋 Copy</button></div><button class="btn-pay" onclick="pay('${m.name}','${m.code}')">💳 Pay Now</button></div>`;
}
function copyCode(code){navigator.clipboard.writeText(code);alert(`Copied: ${code}`);}
function pay(name,code){window.location.href=`/payment.html?merchant=${encodeURIComponent(name)}&code=${code}`;}
document.getElementById('merchantsList').innerHTML=merchants.map(renderCard).join('');
</script>
</body>
</html>
