<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhaPay Blog – Payment Insights for Kenyan Merchants</title>
<meta name="description" content="Read the latest tips and guides about WhatsApp payments, M-Pesa, and growing your business with WhaPay.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  .blog-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
  .blog-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .toast { transition: opacity 0.3s; }
</style>
</head>
<body class="bg-gray-100">

<!-- Same header as your site – simplified for space -->
<header class="bg-gray-900 text-white p-4">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <a href="index.html" class="text-2xl font-bold text-green-500">WhaPay</a>
    <div class="flex items-center gap-4">
      <span id="navUserDisplay" class="text-sm text-gray-300 hidden"></span>
      <button id="navLoginBtn" class="bg-green-600 px-4 py-2 rounded-lg text-sm">Login</button>
      <button id="navLogoutBtn" class="bg-red-600 px-4 py-2 rounded-lg text-sm hidden">Logout</button>
      <a href="https://wa.me/0140933042?text=REGISTER" class="bg-green-500 px-4 py-2 rounded-lg text-sm">Register</a>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-8">
  <!-- Hero -->
  <div class="bg-gradient-to-r from-green-700 to-green-500 rounded-2xl p-8 mb-8 text-white text-center">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">WhaPay Blog</h1>
    <p class="text-green-100">Tips, guides, and insights for Kenyan merchants</p>
  </div>

  <!-- Admin Panel (only visible when logged in) -->
  <div id="adminPanel" class="bg-white rounded-2xl shadow-lg p-6 mb-8 hidden">
    <h2 class="text-2xl font-bold mb-4">✍️ Write New Blog Post</h2>
    <div class="grid grid-cols-1 gap-4">
      <input type="text" id="postTitle" placeholder="Post Title" class="border rounded-lg p-3">
      <select id="postCategory" class="border rounded-lg p-3">
        <option value="M-Pesa">M-Pesa</option>
        <option value="Offline Payments">Offline Payments</option>
        <option value="Kenya">Kenya</option>
        <option value="Global">Global</option>
        <option value="Tips">Tips</option>
      </select>
      <input type="text" id="postImage" placeholder="Image URL (optional)" class="border rounded-lg p-3">
      <textarea id="postExcerpt" rows="3" placeholder="Short excerpt (summary)" class="border rounded-lg p-3"></textarea>
      <textarea id="postContent" rows="10" placeholder="Full blog content (HTML supported)" class="border rounded-lg p-3"></textarea>
      <input type="text" id="postTags" placeholder="Tags (comma separated, e.g., payments, mpesa)" class="border rounded-lg p-3">
      <div class="flex gap-3">
        <button id="savePostBtn" class="bg-green-600 text-white px-6 py-3 rounded-lg font-bold">Save & Publish</button>
        <button id="cancelPostBtn" class="bg-gray-300 px-6 py-3 rounded-lg hidden">Cancel</button>
      </div>
      <div id="postMessage" class="text-sm"></div>
    </div>
  </div>

  <!-- Blog Posts Grid -->
  <div id="blogGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  <div id="loadingState" class="text-center py-12">Loading blog posts...</div>
  <div id="emptyState" class="text-center py-12 hidden">
    <p class="text-gray-500">No blog posts yet. Check back soon!</p>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPAvq6BgpdfZAkfoEwdwmHrWedHgzjRSk",
    authDomain: "whapay-c93ab.firebaseapp.com",
    projectId: "whapay-c93ab",
    storageBucket: "whapay-c93ab.firebasestorage.app",
    messagingSenderId: "205456952458",
    appId: "1:205456952458:web:6533921ca10a2988417173"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUser = null;
  let editingPostId = null;

  // DOM elements
  const adminPanel = document.getElementById('adminPanel');
  const navUserDisplay = document.getElementById('navUserDisplay');
  const navLoginBtn = document.getElementById('navLoginBtn');
  const navLogoutBtn = document.getElementById('navLogoutBtn');
  const blogGrid = document.getElementById('blogGrid');
  const loadingState = document.getElementById('loadingState');
  const emptyState = document.getElementById('emptyState');
  const savePostBtn = document.getElementById('savePostBtn');
  const cancelPostBtn = document.getElementById('cancelPostBtn');
  const postMessage = document.getElementById('postMessage');

  // Helper functions
  function showToast(msg, isErr = false) {
    let toast = document.getElementById('globalToast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'globalToast';
      toast.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-sm z-50 transition-opacity opacity-0';
      document.body.appendChild(toast);
    }
    toast.innerText = msg;
    toast.style.backgroundColor = isErr ? '#dc2626' : '#16a34a';
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    setTimeout(() => toast.classList.add('opacity-0'), 3000);
  }

  function formatDate(timestamp) {
    if (!timestamp) return 'Just now';
    const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
    return date.toLocaleDateString('en-KE', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Clear admin form
  function clearAdminForm() {
    document.getElementById('postTitle').value = '';
    document.getElementById('postCategory').value = 'M-Pesa';
    document.getElementById('postImage').value = '';
    document.getElementById('postExcerpt').value = '';
    document.getElementById('postContent').value = '';
    document.getElementById('postTags').value = '';
    editingPostId = null;
    cancelPostBtn.classList.add('hidden');
    postMessage.innerHTML = '';
  }

  // Load all blog posts
  async function loadBlogPosts() {
    blogGrid.innerHTML = '';
    loadingState.classList.remove('hidden');
    emptyState.classList.add('hidden');
    
    try {
      const q = query(collection(db, 'blogs'), orderBy('createdAt', 'desc'));
      const snapshot = await getDocs(q);
      
      loadingState.classList.add('hidden');
      
      if (snapshot.empty) {
        emptyState.classList.remove('hidden');
        return;
      }
      
      const posts = [];
      snapshot.forEach(doc => posts.push({ id: doc.id, ...doc.data() }));
      
      blogGrid.innerHTML = posts.map(post => `
        <div class="blog-card bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100">
          ${post.image ? `<img src="${escapeHtml(post.image)}" class="w-full h-48 object-cover" onerror="this.src='https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=800&q=80'">` : `
            <div class="w-full h-48 bg-gradient-to-r from-green-100 to-green-50 flex items-center justify-center">
              <i class="fas fa-newspaper text-5xl text-green-300"></i>
            </div>
          `}
          <div class="p-5">
            <div class="flex items-center gap-2 text-xs text-gray-400 mb-2">
              <span>${formatDate(post.createdAt)}</span>
              <span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full">${escapeHtml(post.category || 'General')}</span>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2 line-clamp-2">${escapeHtml(post.title)}</h3>
            <p class="text-gray-500 text-sm mb-4 line-clamp-3">${escapeHtml(post.excerpt || (post.content ? post.content.substring(0, 120).replace(/<[^>]*>/g, '') + '...' : ''))}</p>
            <div class="flex justify-between items-center">
              <span class="text-xs text-gray-400"><i class="far fa-user mr-1"></i> ${escapeHtml(post.author || 'WhaPay Team')}</span>
              <a href="blog-post.html?id=${post.id}" class="text-green-600 text-sm font-semibold hover:underline">Read more →</a>
            </div>
            ${currentUser ? `
              <div class="mt-3 pt-3 border-t flex gap-2">
                <button onclick="editPost('${post.id}')" class="text-blue-600 text-xs">Edit</button>
                <button onclick="deletePost('${post.id}')" class="text-red-600 text-xs">Delete</button>
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
      
    } catch (err) {
      console.error(err);
      loadingState.innerHTML = '<p class="text-red-500">Error loading posts. Please refresh.</p>';
    }
  }

  // Save or update post
  async function savePost() {
    const title = document.getElementById('postTitle').value.trim();
    const category = document.getElementById('postCategory').value;
    const image = document.getElementById('postImage').value.trim();
    const excerpt = document.getElementById('postExcerpt').value.trim();
    const content = document.getElementById('postContent').value.trim();
    const tagsInput = document.getElementById('postTags').value.trim();
    const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()) : [];
    
    if (!title || !content) {
      postMessage.innerHTML = '<span class="text-red-500">Title and content are required</span>';
      return;
    }
    
    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    
    savePostBtn.disabled = true;
    savePostBtn.innerHTML = 'Saving...';
    
    try {
      if (editingPostId) {
        // Update existing post
        await updateDoc(doc(db, 'blogs', editingPostId), {
          title, category, image, excerpt, content, tags,
          updatedAt: serverTimestamp()
        });
        showToast('Post updated successfully');
      } else {
        // Create new post
        await addDoc(collection(db, 'blogs'), {
          title, category, image, excerpt, content, tags,
          slug,
          author: currentUser?.email || 'Admin',
          published: true,
          createdAt: serverTimestamp()
        });
        showToast('Post published successfully');
      }
      
      clearAdminForm();
      loadBlogPosts();
      
    } catch (err) {
      console.error(err);
      postMessage.innerHTML = `<span class="text-red-500">Error: ${err.message}</span>`;
    } finally {
      savePostBtn.disabled = false;
      savePostBtn.innerHTML = 'Save & Publish';
    }
  }

  // Edit post
  window.editPost = async (postId) => {
    if (!currentUser) return;
    
    const q = query(collection(db, 'blogs'));
    const snapshot = await getDocs(q);
    const post = snapshot.docs.find(doc => doc.id === postId)?.data();
    if (!post) return;
    
    editingPostId = postId;
    document.getElementById('postTitle').value = post.title || '';
    document.getElementById('postCategory').value = post.category || 'M-Pesa';
    document.getElementById('postImage').value = post.image || '';
    document.getElementById('postExcerpt').value = post.excerpt || '';
    document.getElementById('postContent').value = post.content || '';
    document.getElementById('postTags').value = (post.tags || []).join(', ');
    cancelPostBtn.classList.remove('hidden');
    adminPanel.classList.remove('hidden');
    adminPanel.scrollIntoView({ behavior: 'smooth' });
  };
  
  // Delete post
  window.deletePost = async (postId) => {
    if (!currentUser) return;
    if (!confirm('Are you sure you want to delete this post?')) return;
    
    try {
      await deleteDoc(doc(db, 'blogs', postId));
      showToast('Post deleted');
      loadBlogPosts();
    } catch (err) {
      showToast('Error deleting post', true);
    }
  };

  // Auth state
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      navUserDisplay.innerText = user.email;
      navUserDisplay.classList.remove('hidden');
      navLoginBtn.classList.add('hidden');
      navLogoutBtn.classList.remove('hidden');
      adminPanel.classList.remove('hidden');
    } else {
      navUserDisplay.classList.add('hidden');
      navLoginBtn.classList.remove('hidden');
      navLogoutBtn.classList.add('hidden');
      adminPanel.classList.add('hidden');
      clearAdminForm();
    }
    loadBlogPosts();
  });
  
  // Login modal (simplified inline)
  let loginModal = null;
  navLoginBtn.onclick = () => {
    const email = prompt('Enter admin email:');
    const password = prompt('Enter password:');
    if (email && password) {
      signInWithEmailAndPassword(auth, email, password)
        .then(() => showToast('Logged in'))
        .catch(err => showToast(err.message, true));
    }
  };
  navLogoutBtn.onclick = () => signOut(auth).then(() => showToast('Logged out'));
  
  savePostBtn.onclick = savePost;
  cancelPostBtn.onclick = clearAdminForm;
  
  // Load posts on page load
  loadBlogPosts();
</script>

<div id="globalToast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-sm z-50 transition-opacity opacity-0 hidden"></div>

<!-- Floating WhatsApp -->
<a href="https://wa.me/0140933042?text=Hello" target="_blank" class="fixed bottom-5 right-5 bg-green-500 text-white p-3 rounded-full shadow-lg z-50">
  <i class="fab fa-whatsapp text-2xl"></i>
</a>

</body>
</html>
