<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, getDocs, where, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPAvq6BgpdfZAkfoEwdwmHrWedHgzjRSk",
    authDomain: "whapay-c93ab.firebaseapp.com",
    projectId: "whapay-c93ab",
    storageBucket: "whapay-c93ab.firebasestorage.app",
    messagingSenderId: "205456952458",
    appId: "1:205456952458:web:6533921ca10a2988417173"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db;

  // Helper: format date
  function formatDate(timestamp) {
    if (!timestamp) return "Recent";
    const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
    return date.toLocaleDateString("en-KE", { year: 'numeric', month: 'long', day: 'numeric' });
  }

  // Load all blog posts (for listing)
  window.loadAllPosts = async () => {
    const q = query(collection(db, "blogs"), orderBy("createdAt", "desc"));
    const snapshot = await getDocs(q);
    const posts = [];
    snapshot.forEach(doc => {
      posts.push({ id: doc.id, ...doc.data() });
    });
    return posts;
  };

  // Load single post by slug
  window.loadPostBySlug = async (slug) => {
    const q = query(collection(db, "blogs"), where("slug", "==", slug), limit(1));
    const snapshot = await getDocs(q);
    if (!snapshot.empty) {
      return { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
    }
    return null;
  };
</script>
